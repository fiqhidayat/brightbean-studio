services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/db.sqlite3
    volumes:
      - app_data:/app/data
      - media_data:/app/media
    restart: unless-stopped

  worker:
    build: .
    command: python manage.py process_tasks
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/db.sqlite3
    volumes:
      - app_data:/app/data
      - media_data:/app/media
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app_data:
  media_data:
